<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B5876">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>다정여수</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif} img{max-width:100%} [hidden]{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (feed app), sticky top bar, fixed bottom tabs, bottom sheets for detail and forms. Sea blue + camellia red (여수 동백). */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#12222C; --muted:#5B6C77; --line:#DFE6EA;
  --sea:#1B5876; --sea-soft:#E1EDF3; --camellia:#C42339; --camellia-soft:#FBE6E9;
  --k-talent:#5E47A8; --k-volunteer:#2A7553; --k-donation:#A9502A; --k-share:#8F6A0E; --k-recruit:#1B5876; --k-need:#0E7C86;
  --k-talent-bg:#ECE8F7; --k-volunteer-bg:#E3F1EA; --k-donation-bg:#F7E9E2; --k-share-bg:#F5EDD8; --k-recruit-bg:#E1EDF3; --k-need-bg:#DFF3F4;
  --scrim:rgba(10,20,26,.45); --shadow:0 10px 40px rgba(12,30,40,.16);
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C151B; --surface:#131F27; --ink:#E4ECF0; --muted:#90A2AD; --line:#22323C;
  --sea:#72B6D6; --sea-soft:#163040; --camellia:#F2596E; --camellia-soft:#3B1A21;
  --k-talent:#B6A6F0; --k-volunteer:#7FD0A8; --k-donation:#F0A17C; --k-share:#E6C266; --k-recruit:#72B6D6; --k-need:#6FD0D8;
  --k-talent-bg:#251F3D; --k-volunteer-bg:#14302A; --k-donation-bg:#3A2219; --k-share-bg:#352B12; --k-recruit-bg:#163040; --k-need-bg:#10343A;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C151B; --surface:#131F27; --ink:#E4ECF0; --muted:#90A2AD; --line:#22323C;
  --sea:#72B6D6; --sea-soft:#163040; --camellia:#F2596E; --camellia-soft:#3B1A21;
  --k-talent:#B6A6F0; --k-volunteer:#7FD0A8; --k-donation:#F0A17C; --k-share:#E6C266; --k-recruit:#72B6D6; --k-need:#6FD0D8;
  --k-talent-bg:#251F3D; --k-volunteer-bg:#14302A; --k-donation-bg:#3A2219; --k-share-bg:#352B12; --k-recruit-bg:#163040; --k-need-bg:#10343A;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
@media (max-width:480px){.brand small{display:none}.icon-btn{width:34px}}
.brand h1 i{font-style:normal;color:var(--camellia)}
.brand h1::before{content:"";width:12px;height:12px;border-radius:50% 50% 50% 0;background:var(--camellia);transform:rotate(-45deg);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
/* top-right icons + DM */
.top-r{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:10px}
.icon-btn svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.8}
.icon-btn .badge{top:1px;left:auto;right:0}
.dm-row{width:100%;text-align:left}
.dm-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.dm-main b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-main small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-main .dm-as{font-size:11.5px;color:var(--sea)}
.dm-row.unread b{font-weight:700}.dm-row.unread small{color:var(--ink)}
.dm-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--camellia);display:block}
.panel.tall{height:calc(94% - env(safe-area-inset-top,0px))}
.msgs{display:flex;flex-direction:column;gap:6px;padding-block:14px;min-height:100%}
.bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;word-break:break-word}
.bubble p{margin:0;white-space:pre-wrap}
.bubble.them{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:var(--sea);color:var(--surface);border-bottom-right-radius:5px}
.bubble .who{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.tstamp{text-align:center;font-size:11.5px;color:var(--muted);margin:8px 0 4px}
.dm-head{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.dm-head span{display:flex;flex-direction:column;min-width:0}
.dm-head b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-head small{font-size:12px;color:var(--muted)}
.as-note{font-size:12px;color:var(--muted);margin:0 0 6px}
/* carousel + composer */
.car{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block}
.car-n{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);display:block;box-shadow:0 0 2px rgba(0,0,0,.4);transition:transform .15s}
.dots i.on{background:#fff;transform:scale(1.25)}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);color:#222;display:none;place-items:center;font-size:18px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.car-btn.l{left:10px}.car-btn.r{right:10px}
@media (hover:hover) and (min-width:600px){.media:hover .car-btn{display:grid}}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.th{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .n{position:absolute;left:4px;bottom:4px;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;padding:1px 6px;border-radius:6px}
.th-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}
.th.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-size:22px;cursor:pointer;gap:2px}
.th.add span{font-size:10.5px}
.pf-move{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:12.5px;color:var(--muted)}.pf-move span{flex:1}
.cmp-prev .ph .pick-btn{background:#fff;color:var(--sea);font-weight:700;font-size:15px;opacity:1;padding:10px 18px;border-radius:999px}
.th .ed{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.th .ed svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2}
.th img{cursor:pointer}
/* crop editor */
.crop-wrap{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:4/5;background:#111;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.crop-wrap img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;will-change:transform}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px)),linear-gradient(to right,transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% + .5px),transparent calc(33.33% + .5px)),linear-gradient(to bottom,transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% + .5px),transparent calc(66.66% + .5px));opacity:0;transition:opacity .15s}
.crop-wrap.active .crop-grid{opacity:1}
.zoom-row{display:flex;align-items:center;gap:10px;max-width:360px;margin:0 auto;width:100%}
.zoom-row input[type=range]{flex:1;accent-color:var(--sea)}
.zoom-row svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.rb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.rb i{display:block;width:22px;background:currentColor;border-radius:3px;opacity:.7}
.rb.on{background:var(--ink);color:var(--surface)}
input:focus-visible+.rb{outline:2px solid var(--sea);outline-offset:-2px}
.lbl{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.adv summary{cursor:pointer;font-size:13.5px;font-weight:600;padding:6px 0;list-style:none;display:flex;justify-content:space-between}
.adv summary::after{content:"›";transform:rotate(90deg);color:var(--muted)}
.adv[open] summary::after{transform:rotate(-90deg)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tgl span{display:flex;flex-direction:column}.tgl b{font-size:14px;font-weight:500}.tgl small{font-size:12px;color:var(--muted)}
.tgl input{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:11px;position:relative;cursor:pointer;flex:none;margin:0}
.tgl input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.tgl input:checked{background:var(--sea)}.tgl input:checked::after{left:20px}
.tile .multi{position:absolute;right:6px;top:6px;width:16px;height:16px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.with{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:13px;color:var(--muted);align-items:center}
.with button{color:var(--sea);font-weight:600}
/* actions right side, hashtags, search, share, collab */
.acts{align-items:center}
.acts .sp{flex:1}
.act.save.on svg{fill:var(--ink)}
.hash{color:var(--sea);font-weight:500}
.srch-wrap{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding-block:10px}
.srch-wrap .search{margin:0}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagcloud button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--sea);font-weight:500}
.tagcloud button small{color:var(--muted);font-weight:400;margin-left:4px}
.share-link{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.share-link input{flex:1;min-width:0;border:0;background:none;font-size:13px;color:var(--ink)}
.share-opts{display:flex;flex-direction:column;gap:8px}
.share-opts .row{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pcard{display:flex;gap:10px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:280px;text-align:left;color:var(--ink)}
.pcard .pimg{width:84px;flex:none;background:var(--kb);display:grid;place-items:center;color:var(--k);font-family:var(--f-display);font-size:12px;padding:6px;text-align:center}
.pcard img{width:84px;height:100%;object-fit:cover;display:block}
.pcard div{padding:8px 10px 8px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bubble.me .pcard{color:var(--ink)}
.collab-req{display:flex;flex-direction:column;gap:8px}
/* notices */
.notice{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.notice .nt{flex:1;min-width:0}
.notice b{display:block;font-size:14px;margin-bottom:2px}
.notice p{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notice.open p{display:block}
.notice .pin{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--sea);background:var(--sea-soft);padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
/* notifications */
.nrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.nrow:first-child{border-top:0}
.nrow.unread{background:var(--sea-soft)}
.nrow .nb{flex:1;min-width:0;font-size:14px;word-break:break-word}
.nrow .nb b{font-weight:600}
.nrow .nb small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nrow .nthumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.nrow .nico{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;color:#fff}
/* block/mute */
.blocked-bar{margin:0;padding:8px 16px;background:var(--camellia-soft);color:var(--camellia);font-size:12.5px}
/* close friends */
.star{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--k-share);color:#fff;font-size:10px;line-height:1;margin-left:4px;vertical-align:-2px;flex:none}
.btn.cf{color:var(--k-share);border-color:var(--k-share)}
.btn.cf.on{background:var(--k-share-bg);color:var(--k-share)}
.cf-band{display:flex;align-items:center;gap:8px;padding:10px 16px 2px;font-size:12.5px;color:var(--k-share);font-weight:600}
.cf-band::after{content:"";flex:1;height:1px;background:var(--k-share-bg)}
.story .cfdot{position:absolute;right:-2px;top:-2px;width:18px;height:18px;border-radius:50%;background:var(--k-share);color:#fff;font-size:11px;display:grid;place-items:center;outline:2px solid var(--surface)}
.code{font-family:var(--f-body);font-size:28px;letter-spacing:.28em;font-weight:600;text-align:center;padding:14px 10px 14px 20px;background:var(--bg);border:1px dashed var(--sea);border-radius:12px;color:var(--sea);font-variant-numeric:tabular-nums}
.mgr-row small b{color:var(--sea)}
/* signup wall (shared-link visitors) */
#gate{position:fixed;inset:0;z-index:22;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.gate{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);text-align:center;animation:up .22s ease-out}
.gate .ob-mark{font-size:34px}
.gate h2{font-family:var(--f-display);font-size:21px;margin:12px 0 6px;text-wrap:balance;word-break:keep-all}
.gate p{margin:0 0 16px;color:var(--muted);font-size:14px;word-break:keep-all}
.gate .ob-f{margin-top:0;flex-direction:column}
.landing-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
.landing-bar span{flex:1;font-size:13px;color:var(--muted);word-break:keep-all}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--line);font-size:15px;text-align:left}
.menu button:first-child{border-top:0}
.menu button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.menu button.danger{color:var(--camellia)}
.menu button small{margin-left:auto;color:var(--muted);font-size:12px}
.sv-post{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);width:84%;max-width:360px;z-index:2}
.sv-post .pcard{max-width:none;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sv-post .pcard img,.sv-post .pcard .pimg{width:96px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
/* stories */
.ring.seen{background:var(--line)}
.story .plus{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--sea);color:var(--surface);display:grid;place-items:center;font-size:15px;line-height:1;outline:2px solid var(--surface)}
.story .wrap{position:relative;display:inline-grid}
#sv{position:fixed;inset:0;z-index:28;background:#0B1216;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.sv-card{position:relative;width:100%;max-width:480px;height:100%;max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#111B21;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){.sv-card{height:min(100%,860px);border-radius:16px}}
.sv-media{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.sv-media img{width:100%;height:100%;object-fit:contain;position:relative}
.sv-media .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.1)}
.sv-media.text{padding:16% 10%;background:linear-gradient(160deg,var(--kb),var(--k))}
.sv-media.text p{margin:0;font-family:var(--f-display);font-size:clamp(24px,7vw,34px);line-height:1.45;color:#fff;text-align:center;text-wrap:balance;word-break:keep-all;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.sv-top{position:relative;z-index:2;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.sv-bars{display:flex;gap:4px}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;display:block}
.sv-bars i b{display:block;height:100%;width:0;background:#fff}
.sv-bars i.done b{width:100%}
.sv-head{display:flex;align-items:center;gap:10px;padding:10px 0 14px;color:#fff}
.sv-head .org-chip b{color:#fff}.sv-head .org-chip small{color:rgba(255,255,255,.8)}
.sv-head .x{color:#fff;margin-left:auto;font-size:26px}
.sv-tap{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:1fr 1fr}
.sv-tap button{opacity:0}
.sv-foot{position:relative;z-index:2;margin-top:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;display:flex;flex-direction:column;gap:10px}
.sv-cap{margin:0;font-size:14.5px;word-break:break-word;white-space:pre-wrap;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.sv-acts{display:flex;gap:8px;align-items:center}
.sv-acts .btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.sv-acts .btn.warn{background:var(--camellia);border-color:transparent}
.sv-acts .eye{font-size:13px;opacity:.9;margin-right:auto}
.sv-paused .sv-bars{opacity:.6}
.bgs{display:flex;gap:8px;flex-wrap:wrap}
.bgs label{cursor:pointer}.bgs input{position:absolute;opacity:0;pointer-events:none}
.bgs span{display:block;width:40px;height:40px;border-radius:12px;background:linear-gradient(160deg,var(--kb),var(--k));border:2px solid transparent}
.bgs input:checked+span{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.st-prev{aspect-ratio:9/14;max-height:280px;width:auto;max-width:100%;margin:0 auto;border-radius:14px;overflow:hidden;display:grid;place-items:center;padding:10%;background:linear-gradient(160deg,var(--kb),var(--k))}
.st-prev p{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.45;color:#fff;text-align:center;word-break:keep-all;text-wrap:balance}
.st-prev img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
/* pulse strip */
.pulse{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line)}
.pulse div,.pulse button{background:var(--surface);padding:10px 8px;text-align:center;display:block;width:100%}
.pulse button span{color:var(--sea)}
.pulse b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.pulse span{font-size:11.5px;color:var(--muted)}
/* skeleton */
.sk{background:var(--surface);border-block:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.sk i{display:block;border-radius:8px;background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* sample mode */
.sample-bar{margin:12px 16px 0;padding:10px 12px;border-radius:10px;border:1px dashed var(--camellia);background:var(--camellia-soft);color:var(--ink);font-size:12.5px;display:flex;gap:10px;align-items:center;word-break:keep-all}
.sample-bar b{color:var(--camellia);white-space:nowrap}
.sample .post{position:relative}
.sample .post::after{content:"예시";position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--camellia);color:var(--surface);padding:2px 7px;border-radius:6px;z-index:1}
.sample .ph-r{margin-right:40px}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn.pri{background:var(--sea);color:var(--surface)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.warn{background:var(--camellia);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.on{background:var(--sea-soft);color:var(--sea)}
.btn[disabled]{opacity:.5;cursor:default}

#notice{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--sea-soft);color:var(--ink);font-size:13px}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding-block:14px;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:0 0 68px;font-size:11.5px;color:var(--ink)}
.story span{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story.add .av{border:1.5px dashed var(--muted);background:var(--surface);color:var(--muted);font-size:26px}

.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;overflow:hidden;background:var(--sea);font-family:var(--f-display)}
.av img{width:100%;height:100%;object-fit:cover}
.ring{padding:2.5px;border-radius:50%;background:conic-gradient(var(--camellia),var(--k-share),var(--camellia));display:inline-grid}
.ring>.av{outline:2.5px solid var(--surface)}
.noring{padding:2.5px;display:inline-grid}

/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.praise-chip{background:var(--camellia,#B4233C)!important;color:#fff!important;box-shadow:none!important;font-weight:700;border-color:transparent!important}.praise-chip b{background:#fff;color:var(--camellia,#B4233C);border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.pr-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}.pr-to{font-size:12px;color:var(--muted);letter-spacing:.02em}.pr-to b{display:block;font-size:17px;color:var(--ink,inherit);margin-top:2px}.pr-text{margin:0;white-space:pre-wrap;line-height:1.65;font-size:14.5px}.pr-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.pr-foot .sp{flex:1}.pr-cheer{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink,inherit)}.pr-cheer.on{background:var(--camellia,#B4233C);color:#fff;border-color:transparent}
.pr-hero{border-radius:18px;padding:20px 18px;background:linear-gradient(150deg,#B4233C,#D9536A);color:#fff;margin:4px 0 14px}.pr-hero h2{margin:0 0 6px;font-size:22px}.pr-hero p{margin:0;opacity:.92;font-size:13.5px;line-height:1.6}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* post */
.feed{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.post{background:var(--surface);border-block:1px solid var(--line)}
@media (min-width:600px){.post{border:1px solid var(--line);border-radius:14px;overflow:hidden}}
.post-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.org-chip{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.org-chip span{display:flex;flex-direction:column;min-width:0}
.org-chip b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-chip small{font-size:12px;color:var(--muted)}
.kind{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;letter-spacing:.02em}
.k-talent{--k:var(--k-talent);--kb:var(--k-talent-bg)} .k-volunteer{--k:var(--k-volunteer);--kb:var(--k-volunteer-bg)}
.k-donation{--k:var(--k-donation);--kb:var(--k-donation-bg)} .k-share{--k:var(--k-share);--kb:var(--k-share-bg)}
.k-recruit{--k:var(--k-recruit);--kb:var(--k-recruit-bg)} .k-need{--k:var(--k-need);--kb:var(--k-need-bg)}
/* 참여 신청 / 도움 패널 */
.ask{margin:4px 0 2px;border:1px solid var(--kb);background:var(--kb);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask .ask-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--k)}
.ask .ask-h b{font-size:14px}
.ask .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--k) 18%,transparent);overflow:hidden}
.ask .bar i{display:block;height:100%;background:var(--k);border-radius:3px}
.ask .ask-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ask .btn.k{background:var(--k);color:var(--surface)}
.ask .btn.k.on{background:var(--surface);color:var(--k);border:1px solid var(--k)}
.ask .closed{font-size:12.5px;color:var(--muted)}
.faces{display:flex;align-items:center}
.faces img,.faces .av{width:24px;height:24px;border-radius:50%;outline:2px solid var(--kb);margin-left:-6px;font-size:11px}
.faces img:first-child,.faces .av:first-child{margin-left:0}
/* 인증 배지 */
.vf{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--sea);color:#fff;font-size:10px;margin-left:3px;vertical-align:-2px;flex:none}
/* 캘린더 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h b{font-family:var(--f-display);font-size:18px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{font-size:11px;color:var(--muted);padding:4px 0}
.cal-g .d{position:relative;aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
.cal-g .d.other{color:var(--line)}
.cal-g .d.today{outline:1.5px solid var(--sea)}
.cal-g .d.sel{background:var(--ink);color:var(--surface)}
.cal-g .d .dots{position:static;margin-top:2px;gap:2px}
.cal-g .d .dots i{width:5px;height:5px;background:var(--k,var(--sea));box-shadow:none}
.cal-g .d.sel .dots i{background:var(--surface)}
.ev{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);text-align:left;width:100%}
.ev:first-child{border-top:0}
.ev .evd{width:46px;flex:none;text-align:center;font-variant-numeric:tabular-nums}
.ev .evd b{display:block;font-size:17px;line-height:1}
.ev .evd small{font-size:11px;color:var(--muted)}
.ev .evt{flex:1;min-width:0}
.ev .evt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .evt small{color:var(--muted);font-size:12px}
/* 활동 리포트 */
.rp-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rp-top{background:linear-gradient(140deg,var(--sea),#2B7A9E);color:#fff;padding:18px 18px 16px}
.rp-top .yr{font-size:12.5px;opacity:.9;letter-spacing:.06em}
.rp-top h2{font-family:var(--f-display);font-size:24px;margin:4px 0 2px;color:#fff;word-break:keep-all}
.rp-top p{margin:0;font-size:13px;opacity:.9}
.rp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.rp-grid div{background:var(--surface);padding:14px 16px}
.rp-grid b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.rp-grid span{font-size:12px;color:var(--muted)}
.rp-sec{padding:14px 16px;border-top:1px solid var(--line)}
.rp-sec h3{margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.mbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:72px}
.mbar div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.mbar i{display:block;width:100%;background:var(--sea);border-radius:3px 3px 0 0;min-height:2px}
.mbar i.z{background:var(--line)}
.mbar small{font-size:9.5px;color:var(--muted)}
.kbars{display:flex;flex-direction:column;gap:6px}
.kbars div{display:grid;grid-template-columns:64px 1fr 32px;gap:8px;align-items:center;font-size:12.5px}
.kbars i{display:block;height:10px;border-radius:5px;background:var(--k)}
.kbars b{text-align:right;font-variant-numeric:tabular-nums}
.rp-foot{padding:10px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between}
/* 활동 배지 */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bd .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--line);color:var(--muted)}
.bd.t1 .ic{background:#D9A56B;color:#fff}.bd.t2 .ic{background:#B8C0CC;color:#fff}.bd.t3 .ic{background:#E7B93C;color:#fff}
.bd b{font-size:12.5px}.bd small{font-size:11px;color:var(--muted)}
.bd .pg{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bd .pg i{display:block;height:100%;background:var(--sea)}
.bd.locked{opacity:.7}
.mini-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.mini-badges span{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--k-share-bg);color:var(--k-share);font-weight:600}
/* 이달의 다정 */
.mo-hero{background:linear-gradient(140deg,var(--sea) 0%,#2B7A9E 55%,var(--camellia) 140%);color:#fff;border-radius:16px;padding:20px 18px;margin-top:12px}
.mo-hero h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px;color:#fff}
.mo-hero p{margin:0;opacity:.9;font-size:13.5px}
.mo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mo-stats div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.mo-stats b{display:block;font-family:var(--f-display);font-size:22px}
.mo-stats span{font-size:11.5px;opacity:.9}
.rankrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.rankrow:first-child{border-top:0}
.rankrow .rk{width:26px;font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center;flex:none}
.rankrow .rk.top{color:var(--camellia)}
.kind{color:var(--k);background:var(--kb)}
.media{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--sea-soft);overflow:hidden;user-select:none}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media.text{aspect-ratio:1/1;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--kb) 55%,var(--surface)) 0%,var(--kb) 60%,color-mix(in srgb,var(--kb) 80%,var(--k)) 100%);display:grid;place-items:center;padding:14% 12%}
.media.text::before{content:"“";position:absolute;left:5%;top:-2%;font-family:var(--f-display);font-size:150px;line-height:1;color:var(--k);opacity:.14;pointer-events:none}
.media.text::after{content:attr(data-sign);position:absolute;right:14px;bottom:12px;font-size:11.5px;letter-spacing:.04em;color:var(--k);opacity:.75;font-weight:600}
.media.text p{margin:0;font-family:var(--f-display);font-size:clamp(19px,5.2vw,26px);line-height:1.5;color:var(--k);text-align:center;text-wrap:balance;word-break:keep-all;position:relative}
@media (min-width:600px){.post{box-shadow:0 1px 2px rgba(12,30,40,.05)}}
.tab[aria-current="page"]::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--camellia);margin-top:1px}
.media.broken img{display:none}
.media.broken::after{content:"사진을 불러올 수 없어요";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst svg{width:96px;height:96px;fill:#fff;filter:drop-shadow(0 4px 16px rgba(0,0,0,.35))}
.burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}45%{transform:scale(.95)}100%{opacity:0;transform:scale(1)}}
.acts{display:flex;gap:4px;padding:6px 6px 0}
.act{width:42px;height:42px;display:grid;place-items:center;border-radius:10px}
.act svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8}
.act.like.on svg{fill:var(--camellia);stroke:var(--camellia)}
.act.like.pop svg{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.post-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:5px}
.count{margin:0;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cap{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.cap b{font-weight:600;margin-right:4px;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;gap:5px}
.meta em{font-style:normal;color:var(--ink);font-weight:500}
.more{color:var(--muted);font-size:13.5px;text-align:left}
.cline{margin:0;font-size:14px;word-break:break-word}
.cline b{font-weight:600;margin-right:5px}
.ago{color:var(--muted);font-size:11.5px}

/* empty */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin-block:16px}
.empty h2{font-family:var(--f-display);font-size:21px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:34ch;word-break:keep-all}
.empty .steps{display:grid;gap:8px;text-align:left;font-size:13.5px;color:var(--ink);margin:6px 0 4px;padding:0;list-style:none}
.empty .steps li{display:flex;gap:10px;align-items:baseline}
.empty .steps b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sea-soft);color:var(--sea);font-size:12px;flex:none}

/* sections / lists */
.sec{padding-block:18px 6px}
.sec h2{font-family:var(--f-display);font-size:19px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec h2 small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .org-chip{flex:1}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-block:14px 12px}
.muted{color:var(--muted);font-size:13.5px}

/* profile */
.back{display:inline-flex;align-items:center;gap:4px;padding-block:12px;color:var(--muted);font-size:14px}
.prof{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.prof h2{font-family:var(--f-display);font-size:23px;margin:0;word-break:keep-all}
.prof .handle{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px;text-align:center}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.bio{margin:14px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sea-soft);color:var(--sea);white-space:nowrap}

<script>

const BIGHEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-9-5.3-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.7-9 12-9 12z"/></svg>';

const REASONS = {spam:'스팸·광고', abuse:'욕설·비방·혐오 표현', privacy:'개인정보 노출', fake:'허위·과장 정보', image:'부적절한 사진', etc:'기타'};

const S = { dbState:'loading', db:null, user:null, assets:null, uid:null, writable:false, isAdmin:false,

  stories:[], sv:null, seenLocal:new Set(), stMode:'text', stBg:'share', sq:'', pendingHash:null, landing:null,

/* ---------- helpers ---------- */
function rel(t){ if(!t) return ''; const s=(Date.now()-t)/1000;
  if(s<60) return '방금'; if(s<3600) return Math.floor(s/60)+'분 전'; if(s<86400) return Math.floor(s/3600)+'시간 전';
  if(s<86400*7) return Math.floor(s/86400)+'일 전'; const d=new Date(t); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }

  return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')'; }
function hue(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h; }

function me(){ return S.people.get(S.uid) || {likes:{}, follows:{}}; }
function myOrgs(){ return [...S.orgs.values()].filter(o => (o.ownerIds||[]).includes(S.uid)); }

/* 활동 지역: 동 단위 복수 선택. 피드 노출은 지역과 무관하게 여수 전역 */

function regionsOf(o){ return o&&o.regions&&o.regions.length?o.regions:(o&&o.region?[o.region]:[ALL_AREA]); }
function regionLabel(o){ const r=regionsOf(o); if(r.includes(ALL_AREA)) return ALL_AREA; return r.length<=2?r.join('·'):r[0]+' 외 '+(r.length-1)+'곳'; }
function regionPicker(prefix, sel){ sel=sel&&sel.length?sel:[ALL_AREA]; const list=[ALL_AREA,...AREAS.filter(a=>a!==ALL_AREA)];
  return `<div class="kinds rp" role="group" aria-label="활동 지역">${list.map(a=>`<label><input type="checkbox" name="${prefix}-rg" value="${a}"${sel.includes(a)?' checked':''}><span>${a}</span></label>`).join('')}</div><span class="hint">여러 동을 함께 고를 수 있어요. ‘${ALL_AREA}’을 고르면 나머지는 해제돼요. 소식은 지역과 상관없이 여수 전체 참여자에게 보여요.</span>`; }
function readRegions(prefix){ const v=[...document.querySelectorAll(`input[name="${prefix}-rg"]:checked`)].map(i=>i.value); return v.length?(v.includes(ALL_AREA)?[ALL_AREA]:v):[ALL_AREA]; }
/* 단체 가입 승인: mod/org_<id> (관리자만 기록). 승인 전 단체는 본인·관리자에게만 보임 */
function orgState(o){ const m=S.mod.get('org_'+o.id)||{}; if(m.approved) return 'approved'; if(m.rejected&&m.rejected.rev===(o.rev||0)) return 'rejected'; return 'pending'; }
function orgApproved(o){ return !!o&&orgState(o)==='approved'; }

function myApprovedOrgs(){ return myOrgs().filter(orgApproved); }
function canSeeOrg(o){ return !!o&&(orgApproved(o)||S.isAdmin||(o.ownerIds||[]).includes(S.uid)); }
const ORG_STATE_LABEL={pending:'가입 승인 대기',approved:'공개 중',rejected:'반려됨'};
function myProfile(){ return me().profile||null; }
function isMember(){ return hasOrg()||!!myProfile(); }
/* 가입 전(비회원·가입 절차 미완료)에는 소식과 댓글 보기만 가능 */
function isGuest(){ return !S.isAdmin&&!isMember(); }
function guestGate(){ if(!S.uid&&window.dj){ toast('가입하면 이용할 수 있어요. 지금은 소식과 댓글만 볼 수 있어요'); openLogin('up'); } else { toast('가입을 마치면 이용할 수 있어요'); openSignup(0); } return false; }
function isHidden(type, x){ const m=S.mod.get(type+'_'+x.id); if(m&&m.status==='hidden') return true; if(m&&m.status==='ok') return false;
  return Object.keys(x.reportedBy||{}).length >= AUTO_HIDE; }
/* 개인 참여자 글: 승인 기록(mod/post_<id>, 관리자만 기록)에 담긴 내용만 공개 */
function isMemberPost(p){ return !p.orgId; }
function modOf(p){ return S.mod.get('post_'+p.id)||null; }
function approvalState(p){ const m=modOf(p)||{}, rev=p.rev||0;
  if(m.rejected&&m.rejected.rev===rev) return 'rejected';
  if(m.approved&&m.approved.rev>=rev) return 'approved';
  return m.approved?'edit-pending':'pending'; }
const APPROVAL_LABEL={pending:'승인 대기',"edit-pending":'수정 승인 대기',approved:'게시 중',rejected:'반려됨'};
function shown(p){ if(!isMemberPost(p)) return p; const m=modOf(p); if(!(m&&m.approved)) return p; const v={...p,...m.approved.live}; if(p.ask&&v.ask) v.ask={...v.ask,closed:!!p.ask.closed}; return v; }
function acctHidden(uid){ if(!uid) return false; const m=S.mod.get('acct_'+uid); if(!m||!m.hide) return false; return !m.until||m.until>Date.now(); }
function visible(p){ return (p.orgId ? orgApproved(S.orgs.get(p.orgId)) : approvalState(p)==='approved') && !isHidden('post',p) && !(acctHidden(p.authorId)&&!S.isAdmin&&p.authorId!==S.uid); }
function livePosts(){ return S.posts.filter(visible); }
/* 홈 피드 순서: 최신순을 기본으로 하되, 가까운 시간대(약 하루 반) 안의 소식끼리는 무작위로 섞음.
   방문(새로고침)마다, 그리고 홈 탭을 다시 누를 때마다 섞는 순서가 바뀜. 방금 올린 내 소식은 맨 위. */
S.feedSeed=Math.random()*1e9|0;
const FEED_JITTER=36*3600e3;
function feedRand(id){ let h=S.feedSeed^2166136261; for(const ch of String(id)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ((h>>>0)%100000)/100000; }
function feedOrder(list){ const now=Date.now();
  const key=p=>{ const t=p.createdAt||0; if(canManage(p)&&now-t<10*60e3) return Infinity; return t+feedRand(p.id)*FEED_JITTER; };
  return [...list].sort((a,b)=>key(b)-key(a)); }
function collabOf(p0){ const ids=(shown(p0).collabs||[]).filter(id=>S.orgs.has(id)&&(p0.collabAccepted||{})[id]); return ids; }
function orgPosts(id){ return livePosts().filter(p => p.orgId === id || collabOf(p).includes(id)); }
function memberPosts(uid){ return livePosts().filter(p => isMemberPost(p) && p.authorId===uid); }
function displayName(uid){ const pr=(S.people.get(uid)||{}).profile; if(pr&&pr.nickname) return pr.nickname; const p=S.profiles[uid]; return (p&&p.name)||''; }
function authorOf(p){
  if(p.orgId){ const o=S.orgs.get(p.orgId); return o?{id:o.id,kind:'org',name:o.name,handle:o.handle||o.name,region:regionLabel(o),av:s=>avatar(o,s)}:null; }
  const pr=(S.people.get(p.authorId)||{}).profile||{}; const name=pr.nickname||displayName(p.authorId)||'참여자'; const fake={name,avatarId:pr.avatarId||null};
  return {id:p.authorId,kind:'member',name,handle:name,region:regionLabel(pr),av:s=>avatar(fake,s)};
}
function authorChip(a, size, extra){ const attr=a.kind==='org'?`data-org="${a.id}"`:`data-member="${a.id}"`;
  return `<button class="org-chip" ${attr}>${a.av(size)}<span><b>${esc(a.name)}</b><small>${a.kind==='member'?'참여자 · ':''}${esc(a.region)}${extra?' · '+extra:''}</small></span></button>`; }
/* 친한 친구: 나만 보는 설정. 해당 계정의 최근 소식이 홈 피드 맨 위, 스토리 맨 앞에 옴 */
const CLOSE_WINDOW=7*DAY_MS();
function DAY_MS(){ return 86400e3; }
function authorKey(p){ return p.orgId?'org:'+p.orgId:'me:'+p.authorId; }
function closeSet(){ return new Set(Object.keys(me().close||{})); }
function isClose(p){ return closeSet().has(authorKey(p)); }
function toggleClose(key){ if(!needWrite()) return; const has=!!(me().close||{})[key]; saveMe(m=>{ m.close=m.close||{}; if(has) delete m.close[key]; else m.close[key]=Date.now(); });
  toast(has?'친한 친구에서 뺐어요':'친한 친구로 설정했어요. 이 계정의 새 소식이 홈 맨 위에 먼저 보여요'); }
function closeBtn(key, sm){ const on=closeSet().has(key); return `<button class="btn ${sm?'sm ':''}cf${on?' on':''}" data-close="${key}" aria-pressed="${on}">★ ${on?'친한 친구':'친한 친구 추가'}</button>`; }
/* 차단·뮤트: 뮤트 = 내 피드에서만 안 보임(상대는 모름). 차단 = 서로의 글·댓글·스토리·메시지가 숨겨짐 */
function myKeys(uid){ uid=uid||S.uid; if(!uid) return []; return ['me:'+uid, ...[...S.orgs.values()].filter(o=>(o.ownerIds||[]).includes(uid)).map(o=>'org:'+o.id)]; }
function authorUids(key){ const i=key.indexOf(':'), t=key.slice(0,i), id=key.slice(i+1); if(t==='me') return [id]; const o=S.orgs.get(id); return o?(o.ownerIds||[]):[]; }
function iBlock(key){ return !!(me().blocked||{})[key]; }
function iMute(key){ return !!(me().muted||{})[key]; }
function theyBlockMe(key){ if(!S.uid) return false; const mine=myKeys(); for(const u of authorUids(key)){ const b=(S.people.get(u)||{}).blocked||{}; if(mine.some(k=>b[k])) return true; } return false; }
function blockedEither(key){ return iBlock(key)||theyBlockMe(key); }
function hiddenForMe(p){ const k=authorKey(p); if(canManage(p)) return false; return iMute(k)||blockedEither(k); }
function commentHidden(c){ if(acctHidden(c.authorId)&&!S.isAdmin&&c.authorId!==S.uid) return true; if(!S.uid||c.authorId===S.uid) return false; const k='me:'+c.authorId; return iMute(k)||iBlock(k)||(((S.people.get(c.authorId)||{}).blocked||{})['me:'+S.uid]); }
function toggleBlock(key, kind){ if(!needWrite()) return; const f=kind==='blocked'?'blocked':'muted'; const has=!!(me()[f]||{})[key];
  saveMe(m=>{ m[f]=m[f]||{}; if(has) delete m[f][key]; else { m[f][key]=Date.now(); if(f==='blocked'&&m.close) delete m.close[key]; } });
  toast(has?(f==='blocked'?'차단을 해제했어요':'뮤트를 해제했어요'):(f==='blocked'?'차단했어요. 서로의 소식과 메시지가 보이지 않아요':'뮤트했어요. 이 계정의 소식이 내 피드에서 숨겨져요')); }
/* 인증 배지: 관리자가 mod/org_<id>.verified 로 부여 */
function isVerified(o){ const m=o&&S.mod.get('org_'+o.id); return !!(m&&m.verified); }
function vbadge(o){ return isVerified(o)?'<span class="vf" title="인증된 단체">✓</span>':''; }
/* 참여/도움 응답: people 문서의 joins/helps에 기록 */
function askOf(p){ return ASK[p.kind]||null; }
function responders(p){ const a=askOf(p); if(!a) return []; const out=[]; for(const [uid,doc] of S.people){ const t=(doc[a.field]||{})[p.id]; if(t) out.push({uid,t}); } return out.sort((x,y)=>x.t-y.t); }
function iResponded(p){ const a=askOf(p); return !!(a&&(me()[a.field]||{})[p.id]); }
function toggleRespond(pid){ const p=S.posts.find(x=>x.id===pid); if(!p) return; const a=askOf(shown(p)); if(!a) return;
  if(!S.uid){ toast('로그인하면 참여할 수 있어요'); return; } if(!isMember()) return shareGate(); if(!needWrite()) return;
  const ask=shown(p).ask||{}; const has=iResponded(p);
  if(!has&&ask.closed){ toast(a.closedText); return; } if(!has&&ask.slots&&responders(p).length>=ask.slots){ toast(a.full); return; }
  saveMe(m=>{ m[a.field]=m[a.field]||{}; if(has) delete m[a.field][pid]; else m[a.field][pid]=Date.now(); });
  toast(has?'신청을 취소했어요':(p.kind==='recruit'?'참여 신청했어요. 단체에서 명단을 확인하고 연락할 거예요':'돕기로 했어요. 단체에서 명단을 보고 연락할 거예요')); }
function askPanel(p0){
  const p=shown(p0), a=askOf(p); if(!a) return ''; const ask=p.ask||{}; const rs=responders(p0); const n=rs.length, on=iResponded(p0), mine=canManage(p0);
  const pct=ask.slots?Math.min(100,Math.round(n/ask.slots*100)):0;
  const faces=rs.slice(0,5).map(r=>{ const pr=S.profiles[r.uid]; const nm=displayName(r.uid)||'?'; return pr&&pr.avatarUrl?`<img src="${esc(pr.avatarUrl)}" alt="">`:`<span class="av" style="background:hsl(${hue(nm)} 42% 40%)">${esc(nm.slice(0,1))}</span>`; }).join('');

function derive(){
  const likes=new Map(), followers=new Map(), commentsBy=new Map();
  for(const [uid,p] of S.people){
    for(const pid in (p.likes||{})){ if(!likes.has(pid)) likes.set(pid,new Set()); likes.get(pid).add(uid); }
    for(const oid in (p.follows||{})){ if(!followers.has(oid)) followers.set(oid,new Set()); followers.get(oid).add(uid); }
  }
  for(const c of S.comments){ if(isHidden('comment',c)||commentHidden(c)) continue; if(!commentsBy.has(c.postId)) commentsBy.set(c.postId,[]); commentsBy.get(c.postId).push(c); }
  return {likes, followers, commentsBy};
}

    if(tag===null){ tag=t; return; } if(t!==tag){ const busy=!$('#sheet').hidden||!$('#onboard').hidden||[...document.querySelectorAll('[data-dirty]')].length; if(busy){ tag=t; toast('새 버전이 나왔어요. 작성을 마친 뒤 새로고침해 주세요'); } else location.reload(); } }catch(_){} };
  check(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); }); setInterval(check,10*60e3); })();

    <div class="field"><label for="rq-a">답변</label><div class="pw-wrap"><input id="rq-a" type="password" required minlength="2" maxlength="60" autocomplete="off" placeholder="답변 (띄어쓰기·대소문자는 구분하지 않아요)"><button type="button" class="pw-eye" data-eye="rq-a" aria-label="답변 보기" aria-pressed="false">${EYE}</button></div><span class="hint">비밀번호를 잊었을 때 이 답변으로 임시 비밀번호를 받을 수 있어요. 답변은 암호화되어 저장돼 운영자도 볼 수 없어요.</span></div>`; }
function rqValue(){ const sel=$('#rq-q').value; const q=sel==='__own'?$('#rq-own').value.trim():sel; return {q, a:$('#rq-a').value.trim()}; }

function authErr(e){ const m=(e&&e.message)||''; return /Invalid login/i.test(m)?'이메일 또는 비밀번호가 맞지 않아요':/already registered/i.test(m)?'이미 가입된 이메일이에요. 로그인해 주세요':/Password should/i.test(m)?'비밀번호는 6자 이상이어야 해요':/rate limit/i.test(m)?'잠시 후 다시 시도해 주세요':'처리하지 못했어요: '+m; }
async function submitLogin(form){ const mode=form.dataset.mode, err=$('#lg-err'), btn=$('#lg-submit'); err.textContent='';

/* 비밀번호 찾기: 이메일 → 질문에 답하기 → 새 비밀번호 */
function openRecover(){ const r=S.rec||(S.rec={step:1,email:'',q:''});
  const body = r.step===1?`<p class="muted" style="margin:0">가입한 이메일을 적으면, 계정을 만들 때 정한 질문이 나와요. 맞게 답하면 임시 비밀번호를 발급해 드려요.</p>

    : `<p class="muted" style="margin:0">답변이 맞아요. 아래 임시 비밀번호가 발급됐어요. 로그인하면 바로 새 비밀번호를 정하게 돼요.</p>
      <div class="pledge" style="margin:0;padding:14px"><p style="margin:0 0 6px;font-weight:600">임시 비밀번호</p><div style="display:flex;gap:8px;align-items:center"><code style="flex:1;font-size:20px;letter-spacing:1px">${esc(r.temp)}</code><button type="button" class="btn sm ghost" data-copy="${esc(r.temp)}">복사</button></div>
      <p class="muted" style="margin:8px 0 0;font-size:12px">이 화면을 닫으면 다시 볼 수 없어요. 기존 비밀번호는 더 이상 쓸 수 없고, 다른 기기의 로그인도 해제됐어요.</p></div>`;
  openSheet('login',{},`${head('비밀번호 찾기')}<div class="panel-b"><form class="form gut" id="login-form" data-mode="recover">

    <button class="btn pri" type="submit" id="lg-submit">${r.step===1?'다음':r.step===2?'임시 비밀번호 받기':'이 비밀번호로 로그인'}</button>
    ${r.step<3?`<p class="hint" style="margin:0;font-size:12.5px">질문을 정하지 않았거나 기억나지 않으면 <button type="button" class="more" data-act="mail-reset" style="color:var(--sea);padding:0">이메일로 재설정 링크 받기</button></p>`:''}
    <div style="font-size:13px"><button type="button" class="more" data-login="in" style="color:var(--sea)">로그인으로 돌아가기</button></div>
  </form></div>`); setTimeout(()=>{ const i=$(r.step===1?'#lg-email':r.step===2?'#rc-a':'#lg-submit'); if(i) i.focus(); },50); }
async function submitRecover(form){ const r=S.rec, err=$('#lg-err'), btn=$('#lg-submit'); btn.disabled=true;
  try{
    if(r.step===1){ r.email=$('#lg-email').value.trim(); r.q=await dj.recoveryQuestion(r.email); r.step=2; return openRecover(); }
    if(r.step===2){ const res=await dj.recoveryTemp(r.email,$('#rc-a').value);
      if(res.status==='ok'){ r.temp=res.pw; r.step=3; return openRecover(); }
      btn.disabled=false; err.textContent=res.status==='locked'?'여러 번 틀려서 1시간 동안 잠겼어요. 나중에 다시 시도하거나 이메일 재설정을 이용해 주세요':'답변이 맞지 않아요. 질문을 정하지 않은 계정이거나 관리자 계정이면 이메일 재설정을 이용해 주세요'; return; }
    btn.textContent='로그인 중'; await dj.signIn(r.email,r.temp); S.rec=null;
  }catch(e){ btn.disabled=false; err.textContent=authErr(e); } }
async function mailReset(){ const r=S.rec||{}; const em=(($('#lg-email')||{}).value||r.email||'').trim(); if(!em){ toast('이메일을 먼저 적어 주세요'); return; }
  try{ await dj.resetPassword(em); closeSheet(); toast('재설정 메일을 보냈어요. 메일의 링크를 누르면 새 비밀번호를 정할 수 있어요'); }catch(e){ toast(authErr(e)); } }
/* 이메일 링크로 들어온 경우: 새 비밀번호 정하기 */

function afterSignup(){ if(S.uid&&window.dj&&dj.tempPending) dj.tempPending().then(p=>{ if(p){ openNewPw(true); } }).catch(()=>{});
  let rcv=null; try{ rcv=localStorage.getItem('dj_pw_recovery'); localStorage.removeItem('dj_pw_recovery'); }catch(_){} if(rcv&&S.uid){ openNewPw(); return; }
  if(S.uid&&window.dj&&dj.myRecoveryQuestion) dj.myRecoveryQuestion().then(q=>{ S.hasRq=!!q; schedule(); }).catch(()=>{});
  let f=null; try{ f=localStorage.getItem('dj_after_signup'); localStorage.removeItem('dj_after_signup'); }catch(_){}
  if(f&&S.uid&&!isMember()){ let t=null; try{ t=JSON.parse(f); }catch(_){}
    if(t&&t.type==='join'&&S.writable){ toast('계정을 만들었어요. 받은 초대 코드를 입력해 주세요'); joinCodeSheet(); }
    else if(t&&t.type&&S.writable){ toast('계정을 만들었어요. 이어서 가입 정보를 입력해 주세요'); openSignup(0); const o=S.ob; o.type=t.type; o.rel=!!t.rel; if(o.rel) o.data.category='종교단체'; o.step=1; obRender(); }
    else { toast('계정을 만들었어요. 이제 단체 또는 개인 참여자로 가입해 주세요'); openSignup(0); } } }

/* ---------- 관리자: 가입 계정 관리 (목록·정지·반려) ---------- */
S.users=null; S.uq=''; S.uf='all';

function userRoles(u){ const orgs=[...S.orgs.values()].filter(o=>(o.ownerIds||[]).includes(u.id)); const pr=(S.people.get(u.id)||{}).profile; return {orgs,pr}; }

const BANNED_BASE=['시의원','도의원','구의원','군의원','국회의원','대통령','국무총리','도지사','구청장','군수','시장님','시장후보','여수시장','여수시시장','지역위원장','당협위원장','공천','선거운동'];
function bannedHit(...parts){ const t=parts.filter(Boolean).join(' ').replace(/\s+/g,''); if(!t) return null;
  for(const w of BANNED_BASE) if(t.includes(w)) return w;
  if(/(^|[^가-힣])시장(님|후보|선거|당선|출마|께서|실)/.test(t)) return '시장';
  for(const w0 of ((S.mod.get('banned')||{}).words||[])){ const w=String(w0).replace(/\s+/g,''); if(w.length>=2&&t.includes(w)) return w; }
  return null; }

    <div class="rep-acts" style="margin-top:6px"><button class="btn sm pri" data-act="ban-save">금지어 저장</button></div>`; }

  try{ await S.db.doc('mod/banned').set({words,at:Date.now(),by:S.uid}); const ta=$('#ban-words'); if(ta) delete ta.dataset.dirty; toast(`금지어 ${words.length}개를 저장했어요`); schedule(); }catch(e){ writeErr(e); } }

function withdrawPlan(){

  const soleIds=new Set(sole.map(o=>o.id));
  const posts=S.posts.filter(p=>(isMemberPost(p)&&p.authorId===S.uid)||soleIds.has(p.orgId));
  const stories=S.stories.filter(s=>soleIds.has(s.orgId)||(s.authorId===S.uid&&!S.orgs.has(s.orgId)));
  const comments=S.comments.filter(c=>c.authorId===S.uid);
  const parties=new Set(['me:'+S.uid,...sole.map(o=>'org:'+o.id)]);
  const convs=S.dms.filter(c=>(c.parties||[]).some(p=>parties.has(p)));
  return {sole,shared,posts,stories,comments,convs};
}

async function withdraw(){
  const err=$('#wd-err'), btn=$('#wd-submit'); err.textContent='';
  if(!$('#wd-agree').checked){ err.textContent='삭제 동의에 체크해 주세요'; return; }
  if($('#wd-text').value.trim()!=='탈퇴'){ err.textContent='‘탈퇴’라고 정확히 입력해 주세요'; return; }
  if(!needWrite()) return;
  const w=withdrawPlan(); btn.disabled=true; const step=t=>{ btn.textContent=t; };
  const tryDo=async(f)=>{ try{ await f(); }catch(_){} };
  try{
    step('게시물 삭제 중'); for(const p of w.posts) await tryDo(()=>removePost(p.id));
    step('스토리 삭제 중'); for(const s of w.stories) await tryDo(async()=>{ await S.db.doc('stories/'+s.id).delete(); if(s.imageId&&S.assets) await S.assets.delete(s.imageId); });
    step('댓글 삭제 중'); for(const c of w.comments) await tryDo(()=>S.db.doc('comments/'+c.id).delete());
    step('메시지 삭제 중'); for(const c of w.convs) await tryDo(async()=>{ const snap=await S.db.collection('dms/'+c.id+'/msgs').limit(1000).get(); for(const d of snap.docs){ try{ await S.db.doc('dms/'+c.id+'/msgs/'+d.id).delete(); }catch(_){} } await S.db.doc('dms/'+c.id).delete(); });
    step('단체 정리 중');
    for(const o of w.shared) await tryDo(()=>S.db.doc('orgs/'+o.id).update({ownerIds:(o.ownerIds||[]).filter(u=>u!==S.uid)}));
    for(const o of w.sole) await tryDo(async()=>{ await S.db.doc('orgs/'+o.id).delete(); if(o.avatarId&&S.assets) await S.assets.delete(o.avatarId); });
    step('계정 정보 삭제 중');
    const pr=myProfile(); if(pr&&pr.avatarId&&S.assets) await tryDo(()=>S.assets.delete(pr.avatarId));
    await tryDo(()=>S.db.doc('reports/'+S.uid).delete());
    await S.db.doc('people/'+S.uid).delete(); S.people.delete(S.uid); S.myReports={};
    if(window.dj){ await dj.deleteMe(); return; }
    closeSheet(); S.hist=[]; S.tab='home'; S.filter='all'; schedule(); window.scrollTo(0,0);
    toast('탈퇴가 완료됐어요. 그동안 함께해 주셔서 고마워요');
  }catch(e){ btn.disabled=false; btn.textContent='탈퇴하고 모두 삭제'; err.textContent='일부 항목을 삭제하지 못했어요. 잠시 후 다시 시도해 주세요'; }
}

function reportGroups(){

}

async function approvalAction(act, pid){

    if(act==='approve'){ const next={...cur,approved:{rev:p.rev||0,live:{kind:p.kind,ratio:ratioOf(p),caption:p.caption,ask:p.ask||null,imageId:p.imageId||null,images:imagesOf(p),location:p.location||null,tags:p.tags||[],collabs:p.collabs||[],hashtags:p.hashtags||hashtagsOf(p.caption),hideLikes:!!p.hideLikes,commentsOff:!!p.commentsOff},at:Date.now(),by:S.uid}}; delete next.rejected; await ref.set(next); toast('승인했어요. 피드에 공개돼요'); }

    schedule();
  }catch(e){ toast('처리하지 못했어요. 잠시 후 다시 시도해 주세요'); }

async function modAction(act, key){
  const g=reportGroups().get(key); if(!g) return;
  const mref=S.db.doc('mod/'+key), cur=S.mod.get(key)||{};
  try{
    if(act==='delete'){
      if(S.confirmMod!==key){ S.confirmMod=key; schedule(); return; }
      S.confirmMod=null;
      if(g.type==='post') await removePost(g.targetId); else if(g.type==='praise') await S.db.doc('praise/'+g.targetId).delete(); else await S.db.doc('comments/'+g.targetId).delete();
    }
    if(act==='org-off'){ const o=S.orgs.get(g.targetId); const n={...cur,rejected:{rev:(o&&o.rev)||0,reason:'관리자 조치로 공개가 중단됐어요. 문의는 메시지로 남겨 주세요',at:Date.now(),by:S.uid}}; delete n.approved; await mref.set(n); }
    if(act==='org-on'){ const n={...cur,approved:{at:Date.now(),by:S.uid}}; delete n.rejected; await mref.set(n); }
    if(act==='hide') await mref.set({...cur,status:'hidden',by:S.uid,at:Date.now()});
    if(act==='show'||act==='ok') await mref.set({...cur,status:'ok',by:S.uid,at:Date.now()});
    if(act!=='show'&&act!=='org-on'){ const status=act==='ok'?'dismissed':'resolved';
      for(const r of g.items) if(r.status==='open') await S.db.doc('reports/'+r.uid).update({items:{[r.rid]:{status,resolvedAt:Date.now()}}}); }
    toast({hide:'숨기고 신고를 처리했어요',show:'다시 공개했어요',ok:'문제 없음으로 처리했어요',delete:'삭제하고 신고를 처리했어요',done:'처리 완료로 표시했어요','org-off':'단체 공개를 중단하고 신고를 처리했어요','org-on':'단체를 다시 공개했어요'}[act]);
  }catch(e){ toast('처리하지 못했어요. 잠시 후 다시 시도해 주세요'); }
}

const STORY_TTL=24*3600e3, STORY_SEC=6000;
function activeStories(){ const now=Date.now(); return S.stories.filter(s=>now-s.createdAt<STORY_TTL&&s.orgId&&orgApproved(S.orgs.get(s.orgId))&&!(S.mod.get('story_'+s.id)||{}).status
  &&(s.kind!=='post'||(()=>{ const p=S.posts.find(x=>x.id===s.postId); return !!p&&visible(p); })())).sort((a,b)=>a.createdAt-b.createdAt); }

function storySeen(s){ return S.seenLocal.has(s.id)||!!(S.uid&&(s.seen||{})[S.uid]); }
function partySeen(pid){ return (storiesByParty().get(pid)||[]).every(storySeen); }
function partyOrder(){ const m=storiesByParty(); return [...m.keys()].sort((a,b)=>(partySeen(a)?1:0)-(partySeen(b)?1:0)); }
function openStories(pid, idx){ const list=storiesByParty().get(pid); if(!list||!list.length) return; closeSheet();
  S.sv={pid,idx:idx||0,start:0,paused:false,elapsed:0}; $('#sv').hidden=false; document.body.style.overflow='hidden'; renderStory(); tickStory(); }

let svRaf=0;
function tickStory(){ cancelAnimationFrame(svRaf); const loop=()=>{ const v=S.sv; if(!v) return; if(!v.paused){ const pct=Math.min(1,(v.elapsed+(performance.now()-v.start))/STORY_SEC); const b=$('#sv .sv-bars i.cur b'); if(b) b.style.width=(pct*100)+'%'; if(pct>=1){ nextStory(); return; } } svRaf=requestAnimationFrame(loop); }; svRaf=requestAnimationFrame(loop); }
function nextStory(){ const v=S.sv; if(!v) return; const list=storiesByParty().get(v.pid)||[]; if(v.idx+1<list.length){ v.idx++; renderStory(); return; }
  const order=partyOrder(); const i=order.indexOf(v.pid); if(i>=0&&i+1<order.length){ v.pid=order[i+1]; v.idx=0; renderStory(); return; } closeStories(); }

  const order=partyOrder(); const i=order.indexOf(v.pid); if(i>0){ v.pid=order[i-1]; v.idx=(storiesByParty().get(v.pid)||[]).length-1; renderStory(); return; } renderStory(); }

function orgReportData(o, year){
  const all=livePosts().filter(p=>p.orgId===o.id||collabOf(p).includes(o.id));
  const inYear=p=>{ if(!year) return true; const d=new Date(p.createdAt); return d.getFullYear()===year; };
  const posts=all.filter(inYear);
  const likes=posts.reduce((n,p)=>n+(D.likes.get(p.id)?.size||0),0), comments=posts.reduce((n,p)=>n+(D.commentsBy.get(p.id)?.length||0),0);
  const joinSet=new Set(); let joins=0; for(const p of posts) for(const r of responders(p)){ joins++; joinSet.add(r.uid); }
  const months=Array.from({length:12},()=>0); for(const p of posts) months[new Date(p.createdAt).getMonth()]++;
  const byKind={}; for(const p of posts){ const k=shown(p).kind; byKind[k]=(byKind[k]||0)+1; }
  const stories=S.stories.filter(s=>s.orgId===o.id&&inYear(s)).length;
  const collabs=new Set(); for(const p of posts){ if(p.orgId===o.id) collabOf(p).forEach(id=>collabs.add(id)); else if(p.orgId) collabs.add(p.orgId); }
  const top=[...posts].sort((a,b)=>((D.likes.get(b.id)?.size||0)+(D.commentsBy.get(b.id)?.length||0)*2)-((D.likes.get(a.id)?.size||0)+(D.commentsBy.get(a.id)?.length||0)*2)).slice(0,3);
  const years=[...new Set(all.map(p=>new Date(p.createdAt).getFullYear()))].sort((a,b)=>b-a);
  return {posts:posts.length,likes,comments,joins,people:joinSet.size,months,byKind,stories,collabs:[...collabs].map(id=>S.orgs.get(id)).filter(Boolean),top,years};
}

function reportText(o, y, r){ return `${y?y+'년':'전체 기간'} ${o.name} 활동 리포트 (다정여수)\n- 올린 소식 ${r.posts}건\n- 참여·도움에 나선 사람 ${r.people}명 (신청 ${r.joins}건)\n- 받은 응원 하트 ${r.likes}개\n- 받은 댓글 ${r.comments}개\n${Object.entries(r.byKind).map(([k,n])=>`- ${KINDS[k]} ${n}건`).join('\n')}${r.collabs.length?`\n- 콜라보 단체: ${r.collabs.map(c=>c.name).join(', ')}`:''}\n기준일 ${new Date().toLocaleDateString('ko-KR')}`; }
async function reportPng(o, y, r){
  const W=1080,H=1350,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H*0.4); g.addColorStop(0,'#1B5876'); g.addColorStop(1,'#2B7A9E'); x.fillStyle='#F3F6F8'; x.fillRect(0,0,W,H); x.fillStyle=g; x.fillRect(0,0,W,420);
  const F='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif', FD='"Gowun Batang","Nanum Myeongjo",serif';
  try{ await document.fonts.load(`700 60px ${FD}`); await document.fonts.load(`600 40px ${F}`); }catch(_){}
  x.fillStyle='rgba(255,255,255,.85)'; x.font=`500 28px ${F}`; x.fillText(`${y?y+'년':'전체 기간'} 활동 리포트 · 다정여수`,72,110);
  x.fillStyle='#fff'; x.font=`700 ${o.name.length>10?56:68}px ${FD}`; x.fillText(o.name+(isVerified(o)?' ✓':''),72,210);
  x.font=`400 30px ${F}`; x.fillStyle='rgba(255,255,255,.9)'; x.fillText(`${o.category||''} · ${regionLabel(o)}`,72,268);
  const cells=[[r.posts,'올린 소식'],[r.people,'참여·도움에 나선 사람'],[r.likes.toLocaleString(),'받은 응원 하트'],[r.comments.toLocaleString(),'받은 댓글']];
  cells.forEach(([v,l],i)=>{ const cx=72+(i%2)*480, cy=480+Math.floor(i/2)*220; x.fillStyle='#fff'; x.beginPath(); x.roundRect(cx,cy,456,190,20); x.fill(); x.fillStyle='#12222C'; x.font=`700 84px ${FD}`; x.fillText(String(v),cx+32,cy+108); x.fillStyle='#5B6C77'; x.font=`500 26px ${F}`; x.fillText(l,cx+32,cy+158); });
  const kinds=Object.entries(r.byKind).sort((a,b)=>b[1]-a[1]).slice(0,6); const kmax=Math.max(1,...kinds.map(k=>k[1])); const colors={talent:'#5E47A8',volunteer:'#2A7553',donation:'#A9502A',share:'#8F6A0E',recruit:'#1B5876',need:'#0E7C86'};
  x.fillStyle='#5B6C77'; x.font=`600 26px ${F}`; x.fillText('어떤 활동이었나',72,980);
  kinds.forEach(([k,n],i)=>{ const yy=1010+i*44; x.fillStyle='#12222C'; x.font=`500 26px ${F}`; x.fillText(KINDS[k],72,yy+22); x.fillStyle='#DFE6EA'; x.beginPath(); x.roundRect(230,yy+2,640,22,11); x.fill(); x.fillStyle=colors[k]||'#1B5876'; x.beginPath(); x.roundRect(230,yy+2,Math.max(22,640*n/kmax),22,11); x.fill(); x.fillStyle='#12222C'; x.font=`600 26px ${F}`; x.textAlign='right'; x.fillText(String(n),1008,yy+22); x.textAlign='left'; });
  x.fillStyle='#5B6C77'; x.font=`400 22px ${F}`; x.fillText(`다정여수 · 여수의 좋은 소식이 모이는 곳 · ${new Date().toLocaleDateString('ko-KR')} 기준`,72,1300);
  return await new Promise(res=>c.toBlob(res,'image/png'));
}
async function saveReport(){ const o=S.orgs.get(S.rpOrg); if(!o) return; const y=S.rpYear, r=orgReportData(o,y);

/* ---------- 알림함: 저장된 데이터에서 내게 온 일들을 모아 보여줌 ---------- */
function myPostIds(){ const mine=new Set(myOrgs().map(o=>o.id)); return S.posts.filter(p=>(p.orgId?mine.has(p.orgId):p.authorId===S.uid)); }
function notifications(){
  if(!S.uid) return []; const out=[], mine=myPostIds(), mineIds=new Set(mine.map(p=>p.id)), myOrgIds=new Set(myOrgs().map(o=>o.id));
  for(const [uid,doc] of S.people){ if(uid===S.uid) continue; for(const pid in (doc.likes||{})){ if(mineIds.has(pid)) out.push({t:doc.likes[pid],kind:'like',uid,pid}); } }
  for(const c of S.comments){ if(mineIds.has(c.postId)&&c.authorId!==S.uid&&!commentHidden(c)) out.push({t:c.createdAt,kind:'comment',uid:c.authorId,pid:c.postId,text:c.text}); }
  for(const p of S.posts){
    for(const id of (p.collabs||[])) if(myOrgIds.has(id)&&!(p.collabAccepted||{})[id]&&!(p.collabDeclined||{})[id]) out.push({t:p.createdAt,kind:'collab-invite',pid:p.id,orgId:id,who:(authorOf(p)||{}).name||'단체'});
    if(mineIds.has(p.id)) for(const [id,ts] of Object.entries(p.collabAccepted||{})) out.push({t:ts,kind:'collab-ok',pid:p.id,orgId:id});
    if(isMemberPost(p)&&p.authorId===S.uid){ const m=modOf(p)||{}; if(m.approved) out.push({t:m.approved.at,kind:'approved',pid:p.id}); if(m.rejected&&m.rejected.rev===(p.rev||0)) out.push({t:m.rejected.at,kind:'rejected',pid:p.id,reason:m.rejected.reason}); }
  }
  for(const o of myOrgs()){ const m=S.mod.get('org_'+o.id)||{}; if(m.approved) out.push({t:m.approved.at,kind:'org-approved',orgId:o.id}); if(m.rejected&&m.rejected.rev===(o.rev||0)) out.push({t:m.rejected.at,kind:'org-rejected',orgId:o.id,reason:m.rejected.reason}); }
  for(const n of liveNotices()) out.push({t:n.createdAt,kind:'notice',nid:n.id,title:n.title});
  if(S.isAdmin){ const np=pendingPosts().length+pendingOrgs().length+[...S.orgs.values()].filter(o=>o.verifyRequest&&!o.verifyRequest.done&&!isVerified(o)).length; if(np) out.push({t:Date.now()-1,kind:'admin',n:np,sticky:true}); }
  for(const p of mine){ const a=askOf(shown(p)); if(a) for(const r of responders(p)) out.push({t:r.t,kind:'respond',uid:r.uid,pid:p.id,label:a.people}); }
  return out.filter(x=>x.t).sort((a,b)=>b.t-a.t).slice(0,100);
}
function notifUnread(){ const seen=me().notifSeenAt||0; return notifications().filter(n=>n.t>seen&&!n.sticky).length; }
function notifView(){
  if(!S.uid) return `<div class="gut"><button class="back" data-tab="home">‹ 홈으로</button><div class="empty"><h2>로그인이 필요해요</h2></div></div>`;
  const list=notifications(), seen=S.notifSeenBefore||0;
  const row=n=>{ const who=n.who||(n.uid?(displayName(n.uid)||'이웃'):n.orgId?(S.orgs.get(n.orgId)||{}).name||'단체':''); const pr=n.uid&&S.profiles[n.uid]; const p=n.pid&&S.posts.find(x=>x.id===n.pid); const img=p&&imagesOf(shown(p))[0];

    const go={like:`data-open="${n.pid}"`,comment:`data-open="${n.pid}"`,'collab-invite':`data-tab="mine"`,'collab-ok':`data-open="${n.pid}"`,approved:`data-open="${n.pid}"`,rejected:`data-open="${n.pid}"`,'org-approved':`data-org="${n.orgId}"`,'org-rejected':`data-org="${n.orgId}"`,notice:`data-tab="home"`,admin:`data-tab="admin"`,respond:`data-responders="${n.pid}"`}[n.kind]||'';
    return `<button class="nrow${n.t>seen&&!n.sticky?' unread':''}" ${go}>${av}<span class="nb">${msg}<small>${rel(n.t)}</small></span>${img?`<img class="nthumb" src="${blobUrl(img)}" alt="">`:''}</button>`; };
  return `<div class="gut"><button class="back" data-tab="home">‹ 홈으로</button><section class="sec" style="padding-top:0"><h2>알림</h2>
    ${list.length?(()=>{ const now=Date.now(); const g={today:[],week:[],older:[]}; for(const n of list){ const d=now-n.t; (d<DAY_MS()?g.today:d<7*DAY_MS()?g.week:g.older).push(n); }
      return [['오늘',g.today],['이번 주',g.week],['이전',g.older]].filter(([,a])=>a.length).map(([t,a])=>`<div class="ngroup">${t}</div><div class="list">${a.map(row).join('')}</div>`).join(''); })():'<div class="empty"><h2>아직 알림이 없어요</h2><p>내 소식에 좋아요나 댓글이 달리거나, 승인·콜라보 소식이 생기면 여기에 모여요.</p></div>'}</section></div>`;
}
function openNotif(){ S.notifSeenBefore=me().notifSeenAt||0; S.hist=[]; go('notif'); if(S.writable&&S.uid){ const latest=Math.max(0,...notifications().filter(n=>!n.sticky).map(n=>n.t)); if(latest>(me().notifSeenAt||0)) saveMe(m=>{ m.notifSeenAt=Date.now(); },true); } }

/* ---------- 단체 공동 관리: 초대 코드로 관리자 합류 ---------- */
const INVITE_TTL=7*86400e3;
function makeCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const r=new Uint32Array(6); crypto.getRandomValues(r); for(const n of r) s+=A[n%A.length]; return s; }
function inviteLive(o){ return o.invite&&o.invite.code&&Date.now()-o.invite.at<INVITE_TTL?o.invite:null; }
async function managersSheet(orgId){
  const o=S.orgs.get(orgId); if(!o||!(o.ownerIds||[]).includes(S.uid)) return;
  const ids=o.ownerIds||[]; let ps={}; if(S.user) ps=await S.user.profiles(ids);
  const inv=inviteLive(o); const left=inv?Math.max(1,Math.ceil((INVITE_TTL-(Date.now()-inv.at))/86400e3)):0;
  openSheet('managers',{orgId},`${head(`${esc(o.name)} 관리자`)}<div class="panel-b"><div class="gut" style="padding-block:14px;display:flex;flex-direction:column;gap:18px">
    <div class="field"><span class="lbl">함께 관리하는 사람 <small class="hint">${ids.length}명</small></span>
      <div class="list">${ids.map((uid,i)=>{ const name=displayName(uid)||(ps[uid]&&ps[uid].name)||'관리자'; const self=uid===S.uid;
        return `<div class="row mgr-row"><img src="${esc(ps[uid]?ps[uid].avatarUrl:'')}" alt="" style="width:40px;height:40px;border-radius:50%;flex:none;background:var(--line)"><span class="dm-main"><b>${esc(name)}${self?' (나)':''}</b><small>${i===0?'<b>대표 관리자</b> · ':''}소식 올리기, 스토리, 메시지, 프로필 수정 모두 가능</small></span>
          ${self?(ids.length>1?`<button class="btn sm ghost" data-mgr="leave" data-org-id="${o.id}">나가기</button>`:'<span class="tag">유일한 관리자</span>'):`<button class="btn sm ghost" data-mgr="remove" data-org-id="${o.id}" data-uid="${esc(uid)}">내보내기</button>`}</div>`; }).join('')}</div>
      <span class="hint">관리자는 모두 같은 권한을 가져요. 누가 올렸는지는 메시지 말풍선과 관리 기록에 남아요.</span></div>
    <div class="field"><span class="lbl">초대 코드</span>
      ${inv?`<div class="code" id="inv-code">${esc(inv.code)}</div><div class="rep-acts" style="justify-content:center"><button class="btn sm pri" data-act="copy-code">코드 복사</button><button class="btn sm ghost" data-mgr="newcode" data-org-id="${o.id}">새 코드 만들기</button><button class="btn sm ghost" data-mgr="revoke" data-org-id="${o.id}">코드 끄기</button></div><span class="hint" style="text-align:center">${left}일 뒤 만료 · 코드를 받은 사람이 ‘내 활동 → 초대 코드 입력’에 넣으면 바로 관리자가 돼요. 여러 명이 같은 코드를 써도 돼요.</span>`
        :`<p class="muted" style="margin:0">함께 관리할 동료에게 줄 초대 코드를 만들어요. 코드는 7일간 유효하고, 언제든 끌 수 있어요.</p><button class="btn pri" data-mgr="newcode" data-org-id="${o.id}">초대 코드 만들기</button>`}</div>
  </div></div>`);
}
async function managerAction(act, orgId, uid){
  const o=S.orgs.get(orgId); if(!o||!(o.ownerIds||[]).includes(S.uid)) return; const ref=S.db.doc('orgs/'+orgId);
  try{
    if(act==='newcode'){ await ref.update({invite:{code:makeCode(),at:Date.now(),by:S.uid}}); toast('새 초대 코드를 만들었어요'); }
    if(act==='revoke'){ await ref.update({invite:{code:'',at:0}}); toast('초대 코드를 껐어요'); }
    if(act==='remove'){ if(S.confirmMgr!==uid){ S.confirmMgr=uid; toast('한 번 더 누르면 내보내요'); return; } S.confirmMgr=null; await ref.update({ownerIds:(o.ownerIds||[]).filter(u=>u!==uid)}); toast('관리자에서 내보냈어요'); }
    if(act==='leave'){ if((o.ownerIds||[]).length<2){ toast('유일한 관리자는 나갈 수 없어요. 먼저 다른 관리자를 초대해 주세요'); return; }
      if(!S.confirmLeave){ S.confirmLeave=true; toast('한 번 더 누르면 이 단체 관리에서 빠져요'); return; } S.confirmLeave=false;
      await ref.update({ownerIds:(o.ownerIds||[]).filter(u=>u!==S.uid)}); closeSheet(); S.hist=[]; go('mine'); toast(`${o.name} 관리에서 나왔어요`); return; }
    setTimeout(()=>managersSheet(orgId),250);
  }catch(e){ writeErr(e); }
}
function joinCodeSheet(){
  openSheet('join',{},`${head('초대 코드로 단체 관리 참여')}<div class="panel-b"><form class="form gut" id="join-form">
    <p class="muted" style="margin:0">단체 관리자에게 받은 6자리 코드를 입력하면 그 단체의 관리자가 되어 소식 올리기, 스토리, 메시지, 프로필 수정을 함께 할 수 있어요.</p>
    <div class="field"><label for="jc">초대 코드</label><input id="jc" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="예: K7P2XD" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px;text-align:center"></div>

async function joinByCode(){
  const inp=$('#jc'), err=$('#jc-err'), btn=$('#jc-submit'); const code=inp.value.trim().toUpperCase(); err.textContent='';
  if(code.length!==6){ err.textContent='6자리 코드를 입력해 주세요'; return; }
  const o=[...S.orgs.values()].find(x=>{ const v=inviteLive(x); return v&&v.code===code; });
  if(!o){ err.textContent='맞는 코드가 없거나 만료됐어요. 단체 관리자에게 새 코드를 요청해 주세요'; return; }
  if((o.ownerIds||[]).includes(S.uid)){ err.textContent='이미 이 단체의 관리자예요'; return; }
  if(!needWrite()) return; btn.disabled=true;
  try{ if(window.dj) await dj.joinOrg(code); else await S.db.doc('orgs/'+o.id).update({ownerIds:[...(o.ownerIds||[]),S.uid]}); closeSheet(); S.hist=[]; go('org',o.id); toast(`${o.name}의 관리자가 되었어요`); }
  catch(e){ btn.disabled=false; writeErr(e); }
}

/* ---------- 메시지(DM): 당사자(party) = org:<단체id> 또는 me:<참여자id> ---------- */
function myParties(){ const a=myApprovedOrgs().map(o=>'org:'+o.id); if(myProfile()) a.push('me:'+S.uid); return a; }
function partyInfo(pid){ const i=pid.indexOf(':'), t=pid.slice(0,i), id=pid.slice(i+1);
  if(t==='org'){ const o=S.orgs.get(id); return o?{id:pid,kind:'org',name:o.name,sub:(o.category||'단체')+' · '+regionLabel(o),av:s=>avatar(o,s),orgId:id}:{id:pid,kind:'org',name:'삭제된 단체',sub:'',av:s=>avatar({name:'?'},s)}; }
  const pr=(S.people.get(id)||{}).profile||{}; const name=pr.nickname||displayName(id)||'참여자';
  return {id:pid,kind:'member',name,sub:'개인 참여자 · '+regionLabel(pr),av:s=>avatar({name,avatarId:pr.avatarId},s),uid:id}; }
function convId(a,b){ return [a,b].sort().join('__'); }
function myConvs(){ const mine=new Set(myParties());
  return S.dms.filter(c=>(c.parties||[]).some(p=>mine.has(p))).map(c=>{ const me=c.parties.find(p=>mine.has(p)); const other=c.parties.find(p=>p!==me)||me;
    const unread=!!c.lastFrom&&c.lastFrom!==me&&(c.lastAt||0)>((c.read||{})[me]||0); return {...c,me,other,unread}; }); }
function dmUnread(){ return S.uid?myConvs().filter(c=>c.unread&&!blockedEither(c.other)).length:0; }
function fmtStamp(t){ const d=new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function dmListView(){
  if(!S.uid) return `<div class="gut"><button class="back" data-tab="home">‹ 홈으로</button><div class="empty"><h2>로그인이 필요해요</h2><p>로그인하면 메시지를 주고받을 수 있어요.</p></div></div>`;

  const convs=myConvs().filter(c=>!blockedEither(c.other)).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0)), multi=myParties().length>1, canSend=myParties().length>0;

    ${canSend?'':'<p class="muted" style="margin:0 0 10px">단체 가입이 승인되면 메시지를 보낼 수 있어요.</p>'}
    ${convs.length?`<div class="list">${convs.map(c=>{ const o=partyInfo(c.other), m=partyInfo(c.me);
      return `<button class="row dm-row${c.unread?' unread':''}" data-conv-me="${c.me}" data-conv-other="${c.other}">${o.av(46)}<span class="dm-main"><b>${esc(o.name)}</b><small>${c.lastFrom===c.me?'나: ':''}${esc((c.lastText||'').slice(0,60))}</small>${multi?`<small class="dm-as">${esc(m.name)} 이름으로</small>`:''}</span><span class="dm-side"><span class="ago">${rel(c.lastAt)}</span>${c.unread?'<i class="dot"></i>':''}</span></button>`; }).join('')}</div>`
      :`<div class="empty"><h2>아직 주고받은 메시지가 없어요</h2><p>단체 프로필의 ‘메시지 보내기’를 누르거나 새 메시지로 시작해 보세요.</p></div>`}
    <p class="muted" style="font-size:12px;margin-top:12px">대화는 두 당사자에게만 보여요. 단체 계정의 메시지는 그 단체를 관리하는 사람 모두가 볼 수 있어요.</p></section></div>`;
}
function dmNewSheet(){
  const parties=myParties(), q=S.dmQ.trim().toLowerCase();
  const mineOrgIds=new Set(parties.filter(p=>p.startsWith('org:')).map(p=>p.slice(4)));
  const list=approvedOrgs().filter(o=>!mineOrgIds.has(o.id)).filter(o=>!q||[o.name,o.handle,o.category,regionsOf(o).join(' ')].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  return `${head('새 메시지')}<div class="panel-b"><div class="gut" style="padding-block:12px">

async function sendDm(){
  const inp=$('#dm-text'), t=inp.value.trim(); if(!t||!needWrite()) return;
  { const w=bannedHit(t); if(w){ bannedToast(w); return; } } const o=S.dmOpen; if(!o) return; inp.value=''; const now=Date.now();
  try{
    await S.db.collection('dms/'+o.cid+'/msgs').add({from:o.me,by:S.uid,text:t,at:now});
    const cur=S.dms.find(c=>c.id===o.cid)||{}; const read={...(cur.read||{}),[o.me]:now};
    await S.db.doc('dms/'+o.cid).set({parties:[o.me,o.other],lastText:t.slice(0,120),lastAt:now,lastFrom:o.me,read});
  }catch(e){ inp.value=t; writeErr(e); }
}
let readT=0;
async function markRead(){ const o=S.dmOpen; if(!o||!S.writable) return; const c=S.dms.find(x=>x.id===o.cid); if(!c||c.lastFrom===o.me) return;
  if(((c.read||{})[o.me]||0)>=(c.lastAt||0)) return; if(Date.now()-readT<1500) return; readT=Date.now();
  try{ await S.db.doc('dms/'+o.cid).update({read:{[o.me]:Date.now()}}); }catch(_){} }
