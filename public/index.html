function obCollect(){ const o=S.ob, d=o.data;
  if(o.type==='org'&&o.step===1){ d.name=$('#ob-name').value.trim(); d.handle=$('#ob-handle').value.trim().toLowerCase(); d.category=$('#ob-cat').value; d.regions=readRegions('ob'); d.region=regionLabel(d); const f=$('#ob-logo'); if(f&&f.files[0]){ o.logo=f.files[0]; o.logoUrl=URL.createObjectURL(f.files[0]); } }
  if(o.type==='org'&&o.step===2){ d.bio=$('#ob-bio').value.trim(); d.manager=$('#ob-manager').value.trim(); d.role=$('#ob-role').value.trim(); d.contact=$('#ob-contact').value.trim(); d.mcontact=$('#ob-mcontact').value.trim();
    if(o.rel) d.religion={faith:$('#ob-faith').value, faithEtc:($('#ob-faith-etc')||{}).value?.trim()||'', denomination:$('#ob-denom').value.trim(), sect:$('#ob-sect').value.trim()}; }
  if(o.type==='member'&&o.step===1){ d.nickname=$('#ob-nick').value.trim(); d.regions=readRegions('ob'); d.region=regionLabel(d); d.bio=$('#ob-bio').value.trim(); const f=$('#ob-file'); if(f&&f.files[0]) o.logo=f.files[0]; }
}
async function obNext(){
  const o=S.ob; if(!o) return; o.err=''; obCollect(); const d=o.data;
  if(o.type==='org'&&o.step===1){
    if(!d.name) o.err='단체 이름을 적어 주세요';
    else if(!/^[a-z0-9._]{3,20}$/.test(d.handle)) o.err='아이디는 영문 소문자, 숫자, 점, 밑줄로 3~20자여야 해요';
    else if([...S.orgs.values()].some(x=>x.handle===d.handle)) o.err='이미 쓰고 있는 아이디예요. 다른 아이디를 골라 주세요';
  }
  if(o.type==='org'&&o.step===1&&!o.err&&d.category==='종교단체'&&!o.rel){ o.rel=true; }
  if(o.type==='org'&&o.step===2){ const R=d.religion||{};
    if(o.rel&&!R.faith) o.err='종교명을 골라 주세요';
    else if(o.rel&&R.faith==='기타'&&!R.faithEtc) o.err='종교명을 직접 입력해 주세요';
    else if(o.rel&&R.denomination.length<2) o.err='교단(소속 총회·종단·교구)을 자세히 적어 주세요';
    else if(o.rel&&R.sect.length<2) o.err='교파를 적어 주세요';
    else if(!d.manager) o.err='담당자 이름을 적어 주세요';
    else if(o.rel&&!/^[0-9+\-()\s]{9,20}$/.test(d.mcontact||'')) o.err='담당자 연락처를 정확히 적어 주세요 (예: 010-0000-0000)'; }
  if(o.type==='member'&&o.step===1&&(d.nickname||'').length<2) o.err='닉네임은 2자 이상 적어 주세요';
  const agreeStep=(o.type==='org'&&o.step===3)||(o.type==='member'&&o.step===2);
  if(agreeStep){ if(!['ob-a1','ob-a2','ob-a3'].every(id=>$('#'+id).checked)) o.err='세 가지 모두 동의해야 가입할 수 있어요'; }
  if(o.err){ obRender(); return; }
  if(!agreeStep){ o.step++; obRender(); return; }
  const btn=$('#ob-submit'); btn.disabled=true; btn.textContent='가입하는 중';
  try{
    let avatarId=null; if(o.logo&&S.assets){ try{ avatarId=await upload(o.logo,480); }catch(_){} }
    if(o.type==='org'){
      const rel=o.rel&&d.religion?{faith:d.religion.faith==='기타'?d.religion.faithEtc:d.religion.faith,denomination:d.religion.denomination,sect:d.religion.sect}:null;
      const ref=await S.db.collection('orgs').add({name:d.name,handle:d.handle,category:o.rel?'종교단체':d.category,religion:rel,regions:d.regions,region:d.region,bio:d.bio||'',contact:d.contact||'',avatarId,ownerIds:[S.uid],rev:0,agreedAt:Date.now(),createdAt:Date.now()});
      o.createdId=ref.id; d.avatarId=avatarId;
      try{ await S.db.doc('orgprivate/'+ref.id).set({manager:d.manager,managerRole:d.role||'',managerContact:d.mcontact||'',at:Date.now()}); }catch(_){}
    } else {
      d.avatarId=avatarId; await saveMe(m=>{ m.profile={nickname:d.nickname,regions:d.regions,region:d.region,bio:d.bio||'',avatarId,type:'individual',agreedAt:Date.now(),joinedAt:Date.now()}; },true);
    }
    o.step++; obRender();
  }catch(e){ btn.disabled=false; btn.textContent='동의하고 가입하기'; o.err=e&&e.code==='banned'?`‘${e.message}’은(는) 금지어라 단체 이름·소개에 쓸 수 없어요`:'가입을 저장하지 못했어요. 잠시 후 다시 시도해 주세요'; obRender(); }
}

/* ---------- images ---------- */
async function bitmapOf(file){ try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(_){ return await createImageBitmap(file); } }
async function shrink(file, max){
  try{ const bmp=await bitmapOf(file); const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.86)); }catch(_){ return file; }
}
/* 인스타그램 피드 규격: 4:5 세로, 1080×1350. crop이 있으면 편집기에서 잡은 구도대로, 없으면 가운데 기준으로 맞춘다 */
async function toFeedBlob(file, crop, outW, ratio){
  try{ const bmp=await bitmapOf(file); const R=RATIOS[ratio]||RATIOS['4:5']; const W=outW||R.w, H=Math.round(W*R.h/R.w);
    const c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d'); ctx.imageSmoothingQuality='high';
    if(crop&&crop.fw){ const k=W/crop.fw; ctx.drawImage(bmp,crop.tx*k,crop.ty*k,bmp.width*crop.s*k,bmp.height*crop.s*k); }
    else { const r=W/H, sr=bmp.width/bmp.height; let sw=bmp.width, sh=bmp.height, sx=0, sy=0;
      if(sr>r){ sw=Math.round(bmp.height*r); sx=Math.round((bmp.width-sw)/2); } else { sh=Math.round(bmp.width/r); sy=Math.round((bmp.height-sh)/2); }
      ctx.drawImage(bmp,sx,sy,sw,sh,0,0,W,H); }
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',outW?.8:.88)); }catch(_){ return file; }
}

/* ---------- 구도 편집기: 4:5 틀 안에서 확대·축소·이동 ---------- */
const C={};
function openCrop(i){
  const f=S.pf&&S.pf.files[i]; if(!f) return; pfCollect(); S.cropIdx=i;
  const src=f.srcUrl||f.url;
  const R=RATIOS[S.pf.ratio]||RATIOS['4:5'];
  openSheet('crop',{keep:true},`${head(`구도 맞추기 <small class="hint">${i+1}번째 사진 · ${R.label}</small>`)}<div class="panel-b"><div class="gut" style="padding-block:14px;display:flex;flex-direction:column;gap:14px">
    <div class="crop-wrap" id="crop" style="aspect-ratio:${R.css}"><img id="crop-img" src="${src}" alt="" draggable="false"><div class="crop-grid"></div></div>
    <div class="zoom-row"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8M8 11h6"/></svg><input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" aria-label="확대 비율"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8M8 11h6M11 8v6"/></svg></div>
    <span class="hint" style="text-align:center">드래그로 이동, 두 손가락이나 슬라이더로 확대·축소. 틀 안에 보이는 부분이 그대로 올라가요.</span>
    <div class="rep-acts" style="justify-content:center"><button class="btn ghost" data-act="crop-reset">원래대로</button><button class="btn pri" data-act="crop-apply">적용</button></div></div></div>`);
  const img=$('#crop-img'), wrap=$('#crop');
  const init=()=>{ C.natW=img.naturalWidth; C.natH=img.naturalHeight; C.fw=wrap.clientWidth; C.fh=wrap.clientHeight; C.cover=Math.max(C.fw/C.natW,C.fh/C.natH);
    if(f.crop&&f.crop.fw&&f.crop.ratio===S.pf.ratio){ const k=C.fw/f.crop.fw; C.zoom=f.crop.s*k/C.cover; C.tx=f.crop.tx*k; C.ty=f.crop.ty*k; } else cropReset(false);
    $('#crop-zoom').value=C.zoom; cropClamp(); cropPaint(); };
  if(img.complete&&img.naturalWidth) init(); else img.onload=init;
}
function cropReset(paint=true){ C.zoom=1; const w=C.natW*C.cover, h=C.natH*C.cover; C.tx=(C.fw-w)/2; C.ty=(C.fh-h)/2; if(paint){ $('#crop-zoom').value=1; cropPaint(); } }
function cropClamp(){ const s=C.cover*C.zoom, w=C.natW*s, h=C.natH*s; C.tx=Math.min(0,Math.max(C.fw-w,C.tx)); C.ty=Math.min(0,Math.max(C.fh-h,C.ty)); }
function cropPaint(){ const img=$('#crop-img'); if(!img) return; const s=C.cover*C.zoom; img.style.transform=`translate(${C.tx}px,${C.ty}px) scale(${s})`; }
function cropZoomTo(z, cx, cy){ z=Math.min(3,Math.max(1,z)); const z0=C.zoom; if(cx===undefined){ cx=C.fw/2; cy=C.fh/2; } const r=z/z0; C.tx=cx-(cx-C.tx)*r; C.ty=cy-(cy-C.ty)*r; C.zoom=z; cropClamp(); cropPaint(); const sl=$('#crop-zoom'); if(sl) sl.value=z; }
async function cropApply(){
  const f=S.pf&&S.pf.files[S.cropIdx]; if(!f) return closeSheet();
  f.crop={fw:C.fw,s:C.cover*C.zoom,tx:C.tx,ty:C.ty,ratio:S.pf.ratio};
  if(!f.srcUrl) f.srcUrl=f.url;
  try{ const b=await toFeedBlob(f.file,f.crop,216,S.pf.ratio); f.url=URL.createObjectURL(b); }catch(_){}
  S.sheet=null; panel().innerHTML=''; $('#sheet').hidden=true; document.body.style.overflow='';

}
const cropPtrs=new Map();
document.addEventListener('pointerdown', e=>{ const w=e.target.closest('#crop'); if(!w) return; w.setPointerCapture(e.pointerId); cropPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); w.classList.add('active');
  if(cropPtrs.size===2){ const [a,b]=[...cropPtrs.values()]; C.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:C.zoom}; } });
document.addEventListener('pointermove', e=>{ if(!cropPtrs.has(e.pointerId)) return; const w=$('#crop'); if(!w) return; const rect=w.getBoundingClientRect(); const prev=cropPtrs.get(e.pointerId);
  if(cropPtrs.size===1){ C.tx+=e.clientX-prev.x; C.ty+=e.clientY-prev.y; cropPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); cropClamp(); cropPaint(); return; }
  cropPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); const [a,b]=[...cropPtrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mx=(a.x+b.x)/2-rect.left, my=(a.y+b.y)/2-rect.top;
  if(C.pinch){ const pm=C.pinchMid||{x:mx,y:my}; C.tx+=mx-pm.x; C.ty+=my-pm.y; C.pinchMid={x:mx,y:my}; cropZoomTo(C.pinch.z*d/C.pinch.d,mx,my); } });
const cropUp=e=>{ cropPtrs.delete(e.pointerId); if(cropPtrs.size<2){ C.pinch=null; C.pinchMid=null; } if(!cropPtrs.size){ const w=$('#crop'); if(w) w.classList.remove('active'); } };
document.addEventListener('pointerup',cropUp); document.addEventListener('pointercancel',cropUp);
document.addEventListener('wheel', e=>{ const w=e.target.closest('#crop'); if(!w) return; e.preventDefault(); const r=w.getBoundingClientRect(); cropZoomTo(C.zoom*(e.deltaY<0?1.08:0.92), e.clientX-r.left, e.clientY-r.top); }, {passive:false});

(async()=>{
  const [db,user,assets,dl]=await Promise.all([use('db'),use('user'),use('assets'),use('downloads')]);
  S.db=db; S.user=user; S.assets=assets; S.canDownload=!!dl;
  if(user){ S.uid=await user.id(); const cw=await user.can('data.write'); S.writable=!!S.uid&&cw!==false; S.isAdmin=await user.canEdit(); }
  if(window.dj&&S.uid&&!S.isAdmin){ try{ S.myStatus=await dj.myStatus(); }catch(_){} if(S.myStatus) S.writable=false; }
  if(!db){ S.dbState='off'; S.writable=false; showNotice(); schedule(); return; }
  showNotice();
  let pending=5; const ready=()=>{ if(--pending===0){ S.dbState='ok'; setTimeout(openFromHash,300); setTimeout(afterSignup,400); } schedule(); };
  const fail=e=>{ if(e&&e.code==='revoked'){ S.dbState='off'; S.writable=false; showNotice(); schedule(); } };
  const once=f=>{ let first=true; return s=>{ f(s); if(first){ first=false; ready(); } else schedule(); }; };
  db.collection('orgs').onSnapshot(once(s=>{ S.orgs=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); }),fail);
  db.collection('posts').orderBy('createdAt','desc').limit(500).onSnapshot(once(s=>{ S.posts=s.docs.map(d=>({id:d.id,...d.data()})); }),fail);
  db.collection('comments').orderBy('createdAt','asc').limit(1000).onSnapshot(once(s=>{ S.comments=s.docs.map(d=>({id:d.id,...d.data()})); }),fail);
  db.collection('people').onSnapshot(once(s=>{ const mine=S.people.get(S.uid); S.people=new Map(s.docs.map(d=>[d.id,d.data()]));
    if(mine&&!S.people.has(S.uid)) S.people.set(S.uid,mine); }),fail);
  db.collection('mod').onSnapshot(once(s=>{ S.mod=new Map(s.docs.map(d=>[d.id,d.data()])); }),fail);
  db.collection('stories').orderBy('createdAt','desc').limit(300).onSnapshot(s=>{ S.stories=s.docs.map(d=>({id:d.id,...d.data()})); schedule(); if(S.sv){ const cur=(storiesByParty().get(S.sv.pid)||[])[S.sv.idx]; if(!cur) renderStory(); else { const b=$('#sv .eye'); if(b) b.textContent='조회 '+Object.keys(cur.seen||{}).length; } } },()=>{});
  S.praise=[]; db.collection('praise').orderBy('createdAt','desc').limit(500).onSnapshot(s=>{ S.praise=s.docs.map(d=>({id:d.id,...d.data()})); schedule(); },()=>{});
  db.collection('notices').orderBy('createdAt','desc').limit(50).onSnapshot(s=>{ S.notices=s.docs.map(d=>({id:d.id,...d.data()})); schedule(); },()=>{});
  try{ S.mtab=localStorage.getItem('dj_mtab')||null; }catch(_){}
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('dj_seen_')) S.seenLocal.add(k.slice(8)); if(k&&k.startsWith('dj_nd_')) S.noticeDismissed.add(k.slice(6)); } }catch(_){}
  if(S.uid) db.doc('reports/'+S.uid).onSnapshot(s=>{ S.myReports=s.exists?s.data():{}; },()=>{});
  if(S.uid) db.collection('dms').orderBy('lastAt','desc').limit(500).onSnapshot(s=>{ S.dms=s.docs.map(d=>({id:d.id,...d.data()})); schedule(); if(S.dmOpen) markRead(); },()=>{});
  if(S.isAdmin){ $('#tab-admin').hidden=false;
    db.collection('reports').onSnapshot(s=>{ S.reports=new Map(s.docs.map(d=>[d.id,d.data()])); schedule(); },()=>{}); }
})();
